name: pokeshop-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    command: ["postgres", "-c", "max_connections=40", "-c", "shared_buffers=64MB"]
    environment:
      POSTGRES_DB: pokeshop
      POSTGRES_USER: pokeshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set production POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokeshop -d pokeshop"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  backend:
    build: ./backend
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      ENVIRONMENT: production
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: pokeshop
      POSTGRES_USER: pokeshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set production POSTGRES_PASSWORD}
      ALLOWED_HOSTS: '["backend", "localhost", "127.0.0.1"]'
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-[]}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/pokemon?limit=1')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    ports:
      - "127.0.0.1:${PRODUCTION_PORT:-8091}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging

volumes:
  postgres_data:
